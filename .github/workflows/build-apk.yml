name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
      - sdk
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # Pinned: ubuntu-latest (moving to Ubuntu 26 from 2026-10-19) stopped being picked up for this
    # public repository on 2026-10-05 -- four runs in a row "not acquired by Runner of type hosted".
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The on-device AI modules are vendored from rmant7/AI: proven identical to the
      # commit local-ai-sdk/SOURCE names before anything is built from them.
      - name: Vendored local-AI sources match rmant7/AI
        run: scripts/check-local-ai-sync.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted ubuntu-latest runners already ship a full Android SDK
      # (ANDROID_HOME) with cmdline-tools; android-actions/setup-android@v3
      # is unmaintained and fails on current runners trying to install a
      # legacy 'tools' package that no longer exists in Google's repository.
      # Just make sure the platform/build-tools this project needs are
      # present and licenses are accepted, using the SDK already there.
      # cmake explicitly, matching the version app/build.gradle.kts pins for
      # its native (llama.cpp JNI) build -- AGP can auto-download it on
      # first use provided licenses are accepted (the --licenses line
      # above), but requesting it up front here avoids depending on that
      # working silently mid-build. The NDK is pinned in app/build.gradle.kts
      # (ndkVersion); AGP auto-provisions exactly that version.
      - name: Ensure Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          # Each provider's rotation pool is one property, comma-separated
          # (ApiKeyRotator/BundledApiKeys drop blank/"null" entries, so a
          # not-yet-added _N secret here is harmless, not a broken key).
          echo "gemini_api_key=${{ secrets.GEMINI_API_KEY_1 }},${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_3 }}" >> local.properties
          echo "groq_api_key=${{ secrets.GROQ_API_KEY_1 }},${{ secrets.GROQ_API_KEY_2 }}" >> local.properties
          echo "gigachat_api_key=${{ secrets.GIGACHAT_API_KEY_1 }},${{ secrets.GIGACHAT_API_KEY_2 }}" >> local.properties
          echo "app_metrica_api_key=${{ secrets.APP_METRICA_API_KEY }}" >> local.properties

      # Real Play Store upload key, only when RELEASE_KEYSTORE_BASE64 has
      # actually been added as a repo secret AND the password/alias actually
      # open it -- app/build.gradle.kts falls back to the debug keystore
      # otherwise. Validated here with `keytool -list`, not left for
      # packageRelease to discover: a bad password there fails the whole
      # build (assembleRelease AND bundleRelease both lost, run #110), where
      # someone just wants an installable APK out of a build regardless of
      # whether the Play-signing secrets happen to be right yet.
      - name: Decode release keystore
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # A trailing \r/\n riding along on a copy-pasted secret is a common,
          # invisible way for a password that "looks right" to actually not
          # match -- strip any CR/LF from the text secrets before they're
          # used anywhere (base64 decoding already ignores embedded
          # newlines by design, so RELEASE_KEYSTORE_BASE64 doesn't need this).
          RELEASE_KEYSTORE_PASSWORD="$(printf '%s' "$RELEASE_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          RELEASE_KEY_ALIAS="$(printf '%s' "$RELEASE_KEY_ALIAS" | tr -d '\r\n')"
          RELEASE_KEY_PASSWORD="$(printf '%s' "$RELEASE_KEY_PASSWORD" | tr -d '\r\n')"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            if keytool -list -keystore app/keystore/release.keystore \
                -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null 2>&1; then
              echo "release_keystore_path=$GITHUB_WORKSPACE/app/keystore/release.keystore" >> local.properties
              echo "release_keystore_password=$RELEASE_KEYSTORE_PASSWORD" >> local.properties
              echo "release_key_alias=$RELEASE_KEY_ALIAS" >> local.properties
              echo "release_key_password=$RELEASE_KEY_PASSWORD" >> local.properties
              echo "play=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              # Present but unusable is a broken production signing setup, not
              # "no key configured": fail, don't quietly ship a debug-signed
              # build. Only a completely absent secret falls back below.
              echo "::error::RELEASE_KEYSTORE_BASE64 is set but keytool couldn't open it with RELEASE_KEYSTORE_PASSWORD/RELEASE_KEY_ALIAS -- fix the signing secrets."
              rm -f app/keystore/release.keystore
              exit 1
            fi
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret -- this build is debug-signed: an installable tester APK, NOT a Play artifact."
          fi
          echo "play=false" >> "$GITHUB_OUTPUT"

      # APK: the one build someone is actually meant to install and test.
      # AAB: what actually gets uploaded to Google Play -- built in the same
      # run, off the same signing config, so a green build here means both
      # are ready together rather than the AAB being a separate, untested
      # afterthought at upload time.
      # Without the upload key app/build.gradle.kts refuses every release task;
      # -PallowDebugSignedRelease is passed only then, to still get a tester
      # APK -- and the AAB is named NOT-FOR-PLAY below.
      - name: Build APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon -PbuildNumber=${{ github.run_number }} ${{ steps.signing.outputs.play != 'true' && '-PallowDebugSignedRelease=true' || '' }}

      # JVM unit tests of the modules that carry AI response contracts:
      # shared (response formats, Gemini/Groq request bodies, the
      # "format unsupported" step-down) and each sub-app's decoder/schema.
      # Release variant: reuses what the build step just compiled.
      - name: Unit tests
        run: ./gradlew :shared:testReleaseUnitTest :OneClickTrip:testReleaseUnitTest :DietTracker:testReleaseUnitTest :SchoolKiller:testReleaseUnitTest :StyleTranslator:testReleaseUnitTest --no-daemon -PbuildNumber=${{ github.run_number }} ${{ steps.signing.outputs.play != 'true' && '-PallowDebugSignedRelease=true' || '' }}

      # The certificate actually on the artifacts, not "a keystore was
      # present": both must carry the upload key when it was available, the
      # committed debug key otherwise. apksigner also fully verifies the APK.
      - name: Verify signing certificates
        env:
          PLAY: ${{ steps.signing.outputs.play }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Whatever the tool's line prefix, the fingerprint is the one run of
          # 64 hex digits once colons are gone (keytool prints AB:CD:..,
          # apksigner plain hex).
          norm() { tr -d ':' | grep -oiE '[0-9a-f]{64}' | head -1 | tr 'A-F' 'a-f'; }
          if [ "$PLAY" = "true" ]; then
            RELEASE_KEYSTORE_PASSWORD="$(printf '%s' "$RELEASE_KEYSTORE_PASSWORD" | tr -d '\r\n')"
            RELEASE_KEY_ALIAS="$(printf '%s' "$RELEASE_KEY_ALIAS" | tr -d '\r\n')"
            expected=$(keytool -list -v -keystore app/keystore/release.keystore -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | grep 'SHA256:' | head -1 | norm)
            label="upload key"
          else
            expected=$(keytool -list -v -keystore app/keystore/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | head -1 | norm)
            label="debug key"
          fi
          aab=$(keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep 'SHA256:' | head -1 | norm)
          apk=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep 'SHA-256 digest' | head -1 | norm)
          echo "expected ($label): $expected"
          echo "AAB:                $aab"
          echo "APK:                $apk"
          if [ -z "$expected" ] || [ "$aab" != "$expected" ] || [ "$apk" != "$expected" ]; then
            echo "::error::Release artifacts are not signed with the $label."
            exit 1
          fi

      # Every .so in the final APK and AAB -- prebuilt ones from AARs included
      # -- must be 16 KB page-size compatible (scripts/check_16kb.py).
      # llama_jni.cpp calls LlamaBridge$TokenSink.onToken by NAME: R8 renaming it
      # crashes the first local generation (release #160). Proven on the mapping.
      - name: JNI callback survives R8
        # Native code calls TokenSink.onToken(String) by name. R8 lists a member in
        # mapping.txt only when it renames it, so: the interface keeps its name, no
        # onToken(String) anywhere is mapped to another name, and the name is in the dex.
        run: |
          m=app/build/outputs/mapping/release/mapping.txt
          grep -q '^ai\.localstudio\.app\.llama\.LlamaBridge\$TokenSink -> ai\.localstudio\.app\.llama\.LlamaBridge\$TokenSink:' "$m" \
            || { echo "::error::LlamaBridge\$TokenSink was renamed or removed by R8"; exit 1; }
          renamed=$(grep -E '^ +[^ ]+ onToken\(java\.lang\.String\)[:0-9]* -> ' "$m" | grep -Ev ' -> onToken$' || true)
          if [ -n "$renamed" ]; then echo "$renamed"; echo "::error::onToken(String) renamed by R8"; exit 1; fi
          n=$(unzip -p app/build/outputs/apk/release/app-release.apk 'classes*.dex' | grep -ac 'onToken' || true)
          echo "dex files mentioning onToken: $n"
          [ "$n" -gt 0 ] || { echo "::error::onToken is not in the release dex"; exit 1; }

      - name: Check 16 KB native library alignment
        run: python3 scripts/check_16kb.py app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab

      - name: Rename outputs with the build number
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/named/Intelliverse-${{ github.run_number }}.apk"
          mkdir -p app/build/outputs/bundle/release/named
          cp app/build/outputs/bundle/release/app-release.aab \
            "app/build/outputs/bundle/release/named/Intelliverse-${{ github.run_number }}${{ steps.signing.outputs.play != 'true' && '-NOT-FOR-PLAY' || '' }}.aab"

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Intelliverse-${{ github.run_number }}
          path: app/build/outputs/apk/release/named/*.apk
          if-no-files-found: error

      - name: Upload AAB (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Intelliverse-${{ github.run_number }}-aab
          path: app/build/outputs/bundle/release/named/*.aab
          if-no-files-found: error

      # R8's mapping.txt for THIS build, named by run number -- the same
      # "Build: #N" every Log-screen report starts with, so an emailed stack
      # trace is matched to exactly the mapping that produced it, not to
      # whatever build happened to run last. Retrace with:
      #   retrace Intelliverse-N-mapping.txt stacktrace.txt
      # (Play Console needs none of this: the AAB carries its own mapping
      # in BUNDLE-METADATA and Android vitals deobfuscates with it
      # automatically.) Deliberately NOT put on the rolling branch release
      # above -- that's overwritten every push, which is exactly what makes
      # a mapping useless for an older build's trace.
      - name: Upload R8 mapping (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Intelliverse-${{ github.run_number }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Workflow artifacts (the upload-artifact step above) expire after 90
      # days and require being signed into the Actions UI to download. A
      # GitHub Release is a permanent, directly-downloadable link instead.
      #
      # ONE rolling release total, tag "latest", shared by every branch this
      # workflow builds -- not one per branch. Per-branch tags meant finding
      # "the latest build" required scrolling the Releases list to find
      # whichever branch you cared about; this build is always whatever ran
      # most recently, across all branches, same as CI itself only ever
      # reports on the one build that just ran.
      #
      # Deleted and recreated rather than edited in place: a GitHub Release
      # sorts by its publish timestamp, and `gh release edit` doesn't bump
      # that -- only a fresh `create` does. Recreating on every run is what
      # actually keeps this at the top of the Releases list (above any
      # version tag pushed from Termux, an older manually-created release,
      # etc.), which is the entire point of a rolling release.
      - name: Publish to the rolling "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="latest"
          NOTES="Intelliverse, build #${{ github.run_number }} -- commit ${{ github.sha }}, branch \`${{ github.ref_name }}\`.
          Always overwritten by the next build on any branch -- not a pinned version, just the most recent build."
          APK="app/build/outputs/apk/release/named/Intelliverse-${{ github.run_number }}.apk"
          AAB="$(ls app/build/outputs/bundle/release/named/*.aab)"
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" "$APK" "$AAB" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Intelliverse -- build #${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "$NOTES"

      # One-time cleanup: "latest-debug" was this same rolling release under
      # its old name/tag (debug + unsigned-release APK pair), replaced above
      # by a per-branch tag (single signed APK) -- left behind otherwise as
      # a stale, confusing second release nothing updates anymore. Tolerant
      # of it already being gone (a previous run already deleted it, or it
      # never existed on this repo) rather than failing the whole build.
      - name: Remove the obsolete "latest-debug" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-debug --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      # One-time cleanup: the per-branch "latest-<slug>" releases this same
      # rolling-release step used to create, one per branch, before it was
      # collapsed into the single shared "latest" release above. Nothing
      # updates these anymore, so they just sit in the Releases list as
      # stale clutter -- remove whichever of these still exist. Safe to
      # remove this step once it's run and they're gone.
      - name: Remove obsolete per-branch rolling releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in latest-main latest-locales latest-migration latest-r8-prep \
                     latest-claude-intelliverse-hybrid-app-f1et5v \
                     latest-claude-fus0-matter-of-choice-check-p0dtnh; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done
