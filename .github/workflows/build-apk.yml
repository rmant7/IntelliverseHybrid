name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted ubuntu-latest runners already ship a full Android SDK
      # (ANDROID_HOME) with cmdline-tools; android-actions/setup-android@v3
      # is unmaintained and fails on current runners trying to install a
      # legacy 'tools' package that no longer exists in Google's repository.
      # Just make sure the platform/build-tools this project needs are
      # present and licenses are accepted, using the SDK already there.
      - name: Ensure Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          # Each provider's rotation pool is one property, comma-separated
          # (ApiKeyRotator/BundledApiKeys drop blank entries) -- so numbered
          # secrets like _2/_3 slot in later just by adding another
          # secrets.<PROVIDER>_API_KEY_N here, with zero other changes.
          echo "gemini_api_key=${{ secrets.GEMINI_API_KEY_1 }}" >> local.properties
          echo "groq_api_key=${{ secrets.GROQ_API_KEY_1 }}" >> local.properties
          echo "gigachat_api_key=${{ secrets.GIGACHAT_API_KEY_1 }}" >> local.properties
          echo "app_metrica_api_key=${{ secrets.APP_METRICA_API_KEY }}" >> local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: intelliverse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: intelliverse-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Workflow artifacts (the two upload-artifact steps above) expire after
      # 90 days and require being signed into the Actions UI to download.
      # A GitHub Release is a permanent, directly-downloadable link instead.
      # One rolling release ("latest-debug"), overwritten on every push,
      # rather than a new release per commit -- this branch pushes often
      # enough that per-commit releases would flood the Releases page.
      - name: Publish to the "latest-debug" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Automatic build from commit ${{ github.sha }} (run #${{ github.run_number }}), branch \`${{ github.ref_name }}\`.
          Always overwritten by the next push -- not a pinned version, just the latest build."
          if gh release view latest-debug --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest-debug \
              app/build/outputs/apk/debug/*.apk \
              app/build/outputs/apk/release/*.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit latest-debug --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create latest-debug \
              app/build/outputs/apk/debug/*.apk \
              app/build/outputs/apk/release/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest build (debug + unsigned release)" \
              --notes "$NOTES"
          fi
