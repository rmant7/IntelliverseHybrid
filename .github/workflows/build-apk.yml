name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted ubuntu-latest runners already ship a full Android SDK
      # (ANDROID_HOME) with cmdline-tools; android-actions/setup-android@v3
      # is unmaintained and fails on current runners trying to install a
      # legacy 'tools' package that no longer exists in Google's repository.
      # Just make sure the platform/build-tools this project needs are
      # present and licenses are accepted, using the SDK already there.
      # cmake explicitly, matching the version app/build.gradle.kts pins for
      # its native (llama.cpp JNI) build -- AGP can auto-download it on
      # first use provided licenses are accepted (the --licenses line
      # above), but requesting it up front here avoids depending on that
      # working silently mid-build. The NDK itself is left unpinned: AGP
      # auto-selects and auto-provisions its own default NDK version for
      # this AGP release the same way.
      - name: Ensure Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          # Each provider's rotation pool is one property, comma-separated
          # (ApiKeyRotator/BundledApiKeys drop blank/"null" entries, so a
          # not-yet-added _N secret here is harmless, not a broken key).
          echo "gemini_api_key=${{ secrets.GEMINI_API_KEY_1 }},${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_3 }}" >> local.properties
          echo "groq_api_key=${{ secrets.GROQ_API_KEY_1 }},${{ secrets.GROQ_API_KEY_2 }}" >> local.properties
          echo "gigachat_api_key=${{ secrets.GIGACHAT_API_KEY_1 }},${{ secrets.GIGACHAT_API_KEY_2 }}" >> local.properties
          echo "app_metrica_api_key=${{ secrets.APP_METRICA_API_KEY }}" >> local.properties

      # Real Play Store upload key, only when RELEASE_KEYSTORE_BASE64 has
      # actually been added as a repo secret AND the password/alias actually
      # open it -- app/build.gradle.kts falls back to the debug keystore
      # otherwise. Validated here with `keytool -list`, not left for
      # packageRelease to discover: a bad password there fails the whole
      # build (assembleRelease AND bundleRelease both lost, run #110), where
      # someone just wants an installable APK out of a build regardless of
      # whether the Play-signing secrets happen to be right yet.
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # A trailing \r/\n riding along on a copy-pasted secret is a common,
          # invisible way for a password that "looks right" to actually not
          # match -- strip any CR/LF from the text secrets before they're
          # used anywhere (base64 decoding already ignores embedded
          # newlines by design, so RELEASE_KEYSTORE_BASE64 doesn't need this).
          RELEASE_KEYSTORE_PASSWORD="$(printf '%s' "$RELEASE_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          RELEASE_KEY_ALIAS="$(printf '%s' "$RELEASE_KEY_ALIAS" | tr -d '\r\n')"
          RELEASE_KEY_PASSWORD="$(printf '%s' "$RELEASE_KEY_PASSWORD" | tr -d '\r\n')"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            if keytool -list -keystore app/keystore/release.keystore \
                -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null 2>&1; then
              echo "release_keystore_path=$GITHUB_WORKSPACE/app/keystore/release.keystore" >> local.properties
              echo "release_keystore_password=$RELEASE_KEYSTORE_PASSWORD" >> local.properties
              echo "release_key_alias=$RELEASE_KEY_ALIAS" >> local.properties
              echo "release_key_password=$RELEASE_KEY_PASSWORD" >> local.properties
            else
              echo "::warning::RELEASE_KEYSTORE_BASE64 is set but keytool couldn't open it with RELEASE_KEYSTORE_PASSWORD/RELEASE_KEY_ALIAS -- falling back to debug signing for this build."
              rm -f app/keystore/release.keystore
            fi
          fi

      # APK: the one build someone is actually meant to install and test.
      # AAB: what actually gets uploaded to Google Play -- built in the same
      # run, off the same signing config, so a green build here means both
      # are ready together rather than the AAB being a separate, untested
      # afterthought at upload time.
      - name: Build APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Rename outputs with the build number
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/named/Intelliverse-${{ github.run_number }}.apk"
          mkdir -p app/build/outputs/bundle/release/named
          cp app/build/outputs/bundle/release/app-release.aab \
            "app/build/outputs/bundle/release/named/Intelliverse-${{ github.run_number }}.aab"

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Intelliverse-${{ github.run_number }}
          path: app/build/outputs/apk/release/named/*.apk
          if-no-files-found: error

      - name: Upload AAB (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Intelliverse-${{ github.run_number }}-aab
          path: app/build/outputs/bundle/release/named/*.aab
          if-no-files-found: error

      # R8's mapping.txt for THIS build, named by run number -- the same
      # "Build: #N" every Log-screen report starts with, so an emailed stack
      # trace is matched to exactly the mapping that produced it, not to
      # whatever build happened to run last. Retrace with:
      #   retrace Intelliverse-N-mapping.txt stacktrace.txt
      # (Play Console needs none of this: the AAB carries its own mapping
      # in BUNDLE-METADATA and Android vitals deobfuscates with it
      # automatically.) Deliberately NOT put on the rolling branch release
      # above -- that's overwritten every push, which is exactly what makes
      # a mapping useless for an older build's trace.
      - name: Upload R8 mapping (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Intelliverse-${{ github.run_number }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Each branch gets its own rolling release instead of every branch
      # sharing one "latest" tag. With more than one branch building in
      # parallel (e.g. this branch and a matter-of-choice branch developed
      # alongside it), a single shared "latest" release meant whichever
      # branch pushed last silently overwrote the other's APK. Slugifying
      # the branch name into the tag keeps each branch's rolling release
      # independent; GitHub's own "/releases/latest" convenience link still
      # resolves to whichever tagged release was published most recently,
      # so nothing downstream that relied on that link breaks.
      - name: Compute release tag
        id: release_tag
        run: |
          SLUG=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          echo "tag=latest-$SLUG" >> "$GITHUB_OUTPUT"

      # Workflow artifacts (the upload-artifact step above) expire after 90
      # days and require being signed into the Actions UI to download. A
      # GitHub Release is a permanent, directly-downloadable link instead.
      # One rolling release per branch, overwritten on every push to that
      # same branch, rather than a new release per commit -- this branch
      # pushes often enough that per-commit releases would flood the
      # Releases page. Old asset is deleted first: its filename includes
      # the build number, which changes every run, so a plain upload would
      # just pile up a new file instead of replacing the old one.
      - name: Publish to this branch's rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          NOTES="Intelliverse, build #${{ github.run_number }} -- commit ${{ github.sha }}, branch \`${{ github.ref_name }}\`.
          Always overwritten by the next push to this branch -- not a pinned version, just the latest build."
          APK="app/build/outputs/apk/release/named/Intelliverse-${{ github.run_number }}.apk"
          AAB="app/build/outputs/bundle/release/named/Intelliverse-${{ github.run_number }}.aab"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for asset in $(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
            gh release upload "$RELEASE_TAG" "$APK" "$AAB" --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Intelliverse -- build #${{ github.run_number }} (${{ github.ref_name }})" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" "$APK" "$AAB" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Intelliverse -- build #${{ github.run_number }} (${{ github.ref_name }})" \
              --notes "$NOTES"
          fi

      # One-time cleanup: "latest-debug" was this same rolling release under
      # its old name/tag (debug + unsigned-release APK pair), replaced above
      # by a per-branch tag (single signed APK) -- left behind otherwise as
      # a stale, confusing second release nothing updates anymore. Tolerant
      # of it already being gone (a previous run already deleted it, or it
      # never existed on this repo) rather than failing the whole build.
      - name: Remove the obsolete "latest-debug" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-debug --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
