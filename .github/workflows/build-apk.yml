name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted ubuntu-latest runners already ship a full Android SDK
      # (ANDROID_HOME) with cmdline-tools; android-actions/setup-android@v3
      # is unmaintained and fails on current runners trying to install a
      # legacy 'tools' package that no longer exists in Google's repository.
      # Just make sure the platform/build-tools this project needs are
      # present and licenses are accepted, using the SDK already there.
      - name: Ensure Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "gemini_api_key=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          echo "grok_api_key=${{ secrets.GROK_API_KEY }}" >> local.properties
          echo "gigachat_api_key=${{ secrets.GIGACHAT_API_KEY }}" >> local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: intelliverse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: intelliverse-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
