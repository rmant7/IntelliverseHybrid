name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted ubuntu-latest runners already ship a full Android SDK
      # (ANDROID_HOME) with cmdline-tools; android-actions/setup-android@v3
      # is unmaintained and fails on current runners trying to install a
      # legacy 'tools' package that no longer exists in Google's repository.
      # Just make sure the platform/build-tools this project needs are
      # present and licenses are accepted, using the SDK already there.
      - name: Ensure Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          # Each provider's rotation pool is one property, comma-separated
          # (ApiKeyRotator/BundledApiKeys drop blank entries) -- so numbered
          # secrets like _2/_3 slot in later just by adding another
          # secrets.<PROVIDER>_API_KEY_N here, with zero other changes.
          echo "gemini_api_key=${{ secrets.GEMINI_API_KEY_1 }}" >> local.properties
          echo "groq_api_key=${{ secrets.GROQ_API_KEY_1 }}" >> local.properties
          echo "gigachat_api_key=${{ secrets.GIGACHAT_API_KEY_1 }}" >> local.properties
          echo "app_metrica_api_key=${{ secrets.APP_METRICA_API_KEY }}" >> local.properties

      # Debug-signed (see app/build.gradle.kts's release signingConfig), not
      # a real Play Store release build -- just the one APK someone is
      # actually meant to install and test. No separate debug variant: it
      # only ever differed by BuildConfig.DEBUG and the signing key, and
      # this project's own diagnostic logging (AppLogTree) is planted
      # unconditionally either way.
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Rename APK with the build number
        run: |
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/named/Intelliverse-${{ github.run_number }}.apk"

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Intelliverse-${{ github.run_number }}
          path: app/build/outputs/apk/release/named/*.apk
          if-no-files-found: error

      # Workflow artifacts (the upload-artifact step above) expire after 90
      # days and require being signed into the Actions UI to download. A
      # GitHub Release is a permanent, directly-downloadable link instead.
      # One rolling release ("latest"), overwritten on every push, rather
      # than a new release per commit -- this branch pushes often enough
      # that per-commit releases would flood the Releases page. Old asset
      # is deleted first: its filename includes the build number, which
      # changes every run, so a plain upload would just pile up a new file
      # instead of replacing the old one.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Intelliverse, build #${{ github.run_number }} -- commit ${{ github.sha }}, branch \`${{ github.ref_name }}\`.
          Always overwritten by the next push -- not a pinned version, just the latest build."
          APK="app/build/outputs/apk/release/named/Intelliverse-${{ github.run_number }}.apk"
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for asset in $(gh release view latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              gh release delete-asset latest "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
            gh release upload latest "$APK" --repo "$GITHUB_REPOSITORY"
            gh release edit latest --repo "$GITHUB_REPOSITORY" \
              --title "Intelliverse -- build #${{ github.run_number }}" --notes "$NOTES"
          else
            gh release create latest "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Intelliverse -- build #${{ github.run_number }}" \
              --notes "$NOTES"
          fi
